# golangci-lint v2. New code is held to every linter below with no exclusions.
# internal/legacy (the upstream SDKv2 code) has a documented debt baseline, see
# dev-docs/backlog.md "Legacy lint debt". The baseline only shrinks: code migrated out of
# internal/legacy, or rewritten inside it, must pass with no exclusion.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: US
  exclusions:
    generated: strict
    rules:
      # Legacy debt baseline (counted 2026-10-31): 576 unchecked d.Set, and nothing else. Every
      # other linter passes on internal/legacy (was 1439 d.Set, 32 json.Unmarshal, 60 QF1008, ...
      # on 2026-10-26). Any other unchecked error there fails the lint.
      - path: internal/legacy/
        linters: [errcheck]
        text: "Error return value of `d.Set` is not checked"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mtn/terraform-provider-mtncloud
