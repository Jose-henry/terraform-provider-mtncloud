version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      terraform-plugin:
        patterns: ["github.com/hashicorp/terraform-plugin-*"]
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["github.com/hashicorp/terraform-plugin-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
